set -g escape-time 10
set -g mouse on
set -g focus-events on

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind | split-window -h
bind - split-window -v

bind r source-file ~/.config/tmux/tmux.conf \; display-message "reloaded"

set -g default-terminal "tmux-256color"
set -as terminal-overrides ",*256col*:Tc"

# Let programs inside tmux talk to the outer terminal directly:
# image protocols, OSC 52 clipboard, shell integration.
set -g allow-passthrough on

set -g extended-keys
set -g extended-keys-format csi-u

# Sessions here outlive the connection and there are usually
# several, so their names have to be visible.
set -g status on
set -g status-style "bg=default"
set -g status-left  " #[bold]#S#[default] "
set -g status-right " %Y-%m-%d %H:%M "
set -g status-justify centre
